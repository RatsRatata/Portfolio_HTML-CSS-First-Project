<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/dbe048ae79.js" crossorigin="anonymous"></script>
</head>
<body>
    <header>
        <img src="images/Website_Logo.png">
        <h1>My Portfolio</h1>
    </header>

    <!-- Navigation Bar-->
    <nav id="navbar">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <!-- Dropdown Menu -->
            <li class="dropdown">
                <a href="#">Works<i class="fa-solid fa-caret-down"></i></a>
                <ul class="dropdown-content">
                    <li><a href="gallery.html">Web Development</a></li>
                    <li><a href="gallery.html">Tools</a></li>

            </li>
            <li><a href="gallery.html">Projects</a></li>
            <li><a href="contact.html">Contact Me</a></li>
        </ul>
    </nav>
    <main>
        <!--Name, Email, Dropdown, TextArea-->
        <h2>Contact Me!</h2>
        <form>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject:</label>
            <select id="subject" name="subject">
                <option value="Inquiry">Inquiry</option>
                <option value="Collaboration">Project Collaboration</option>
                <option value="Feedback">Feedback</option>
            </select>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>
    </main>

    <footer>
        <a href="https://github.com/RatsRatata"><i class="fa-brands fa-github"></i></a>
        &copy; 2026
    </footer>
</body>
